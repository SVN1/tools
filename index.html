<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SVN1 // TOOLS</title>
<style>
  :root{
    --bg:#0a0a0b;
    --panel:#131316;
    --border:#26262b;
    --text:#e6e6e6;
    --dim:#6b6b74;
    --accent:#ff8c1a;
    --accent-dim:#5c3d14;
    --mono: 'IBM Plex Mono', 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    padding:32px 20px 60px;
  }
  .wrap{max-width:960px; margin:0 auto;}

  /* header / boot bar */
  header{
    border:1px solid var(--border);
    background:var(--panel);
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    font-size:12px;
    letter-spacing:0.5px;
  }
  header .id{color:var(--accent); font-weight:600;}
  header .clock{color:var(--dim);}
  .subbar{
    border:1px solid var(--border);
    border-top:none;
    background:#0e0e10;
    padding:10px 18px;
    font-size:11px;
    color:var(--dim);
    margin-bottom:28px;
    display:flex;
    gap:24px;
    flex-wrap:wrap;
  }
  .subbar span b{color:var(--text); font-weight:500;}
  .blink{display:inline-block; width:7px; color:var(--accent); animation:blink 1.1s step-start infinite;}
  @keyframes blink{50%{opacity:0;}}

  h1{
    font-size:15px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:16px;
    font-weight:500;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }

  .card{
    border:1px solid var(--border);
    background:var(--panel);
    padding:18px;
    text-decoration:none;
    color:var(--text);
    display:block;
    position:relative;
    transition:border-color .15s ease, transform .1s ease;
  }
  .card:hover{
    border-color:var(--accent);
  }
  .card:hover .go{color:var(--accent);}

  .tag{
    font-size:10px;
    letter-spacing:1px;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:10px;
    display:block;
  }
  .card h2{
    font-size:15px;
    font-weight:600;
    margin-bottom:8px;
    letter-spacing:0.2px;
  }
  .card p{
    font-size:12px;
    line-height:1.5;
    color:var(--dim);
    margin-bottom:16px;
  }
  .go{
    font-size:11px;
    color:var(--dim);
    letter-spacing:0.5px;
  }
  .go::after{content:" →";}

  footer{
    margin-top:40px;
    font-size:10px;
    color:var(--dim);
    border-top:1px solid var(--border);
    padding-top:14px;
    display:flex;
    justify-content:space-between;
  }

  @media (max-width:480px){
    .subbar{gap:12px;}
    header{flex-direction:column; align-items:flex-start; gap:6px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="id">SVN1 // TOOLS TERMINAL</span>
    <span class="clock" id="clock">--:--:-- UTC</span>
  </header>
  <div class="subbar">
    <span>STATUS <b>ONLINE</b></span>
    <span>TOOLS <b id="toolcount">3</b></span>
    <span>BUILD <b id="builddate"></b></span>
    <span><span class="blink">█</span></span>
  </div>

  <h1>Active Tools</h1>
  <div class="grid" id="grid">
    <p style="color:var(--dim); font-size:12px;">Loading manifest…</p>
  </div>

  <footer>
    <span>github.com/SVN1/tools</span>
    <span id="lastupdate"></span>
  </footer>

</div>

<script>
  function pad(n){return n.toString().padStart(2,'0');}
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds())+' UTC';
  }
  tick();
  setInterval(tick, 1000);

  const today = new Date();
  const dateStr = today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  document.getElementById('builddate').textContent = dateStr;
  document.getElementById('lastupdate').textContent = 'last updated ' + dateStr;

  fetch('manifest.json')
    .then(r => r.json())
    .then(tools => {
      document.getElementById('toolcount').textContent = tools.length;
      const grid = document.getElementById('grid');
      grid.innerHTML = tools.map(t => `
        <a class="card" href="${t.file}">
          <span class="tag">${t.tag}</span>
          <h2>${t.name}</h2>
          <p>${t.description}</p>
          <span class="go">Open tool</span>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('grid').innerHTML =
        '<p style="color:var(--dim); font-size:12px;">Could not load manifest.json — make sure it is uploaded at the repo root.</p>';
    });
</script>

</body>
</html>
